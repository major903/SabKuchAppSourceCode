plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.firebase.crashlytics'
    id 'com.google.firebase.firebase-perf'
    id 'com.google.gms.google-services'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
    id 'org.jlleitschuh.gradle.ktlint'
    id 'io.gitlab.arturbosch.detekt'
}

def registrationApiBaseUrl = (project.findProperty('registrationApiBaseUrl') ?: 'https://api.sabkuchworld.com').toString().replace('"', '\\"')
def registrationCompanyId = (project.findProperty('registrationCompanyId') ?: '').toString().replace('"', '\\"')
def appUpdateManifestUrl = (project.findProperty('appUpdateManifestUrl') ?: 'https://raw.githubusercontent.com/forexveda/SabkuchApp/upgrade_android_14/update.json').toString().replace('"', '\\"')
def enableTestCoverage = (project.findProperty('enableTestCoverage') ?: 'false').toString().toBoolean()
def stableDebugKeystorePath = (project.findProperty('sabkuchDebugKeystore')
        ?: System.getenv('SABKUCH_DEBUG_KEYSTORE')
        ?: 'E:/BatoBuzzBuildCache/AndroidUserHome/debug.keystore').toString()
def stableDebugKeystore = file(stableDebugKeystorePath)

android {
    namespace 'vedam.subkuch'
    compileSdk 36
    signingConfigs {
        debug {
            // IMPORTANT: Keep this keystore stable. A different generated debug key changes the
            // certificate and Android will reject in-place updates with UPDATE_INCOMPATIBLE.
            // Override with -PsabkuchDebugKeystore=... or SABKUCH_DEBUG_KEYSTORE on other machines.
            if (stableDebugKeystore.exists()) {
                storeFile stableDebugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    defaultConfig {
        applicationId "vedam.subkuch"
        minSdk 26
        targetSdk 36
        versionCode 69
        versionName "1.10"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        // Can be overridden per build, for example:
        // gradlew -PregistrationApiBaseUrl=https://api.example.com -PregistrationCompanyId=123 assembleDebug
        buildConfigField "String", "REGISTRATION_API_BASE_URL", "\"${registrationApiBaseUrl}\""
        buildConfigField "String", "REGISTRATION_COMPANY_ID", "\"${registrationCompanyId}\""
        buildConfigField "String", "APP_UPDATE_MANIFEST_URL", "\"${appUpdateManifestUrl}\""
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            testCoverageEnabled enableTestCoverage
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }
    compileOptions {
//        encoding "UTF-8"
        encoding = 'ISO-8859-1'
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
        freeCompilerArgs += "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi"
        freeCompilerArgs += "-opt-in=kotlinx.coroutines.FlowPreview"
    }

}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':leku')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    // Check for v11.4.2 or higher
//    implementation 'com.google.firebase:firebase-core:18.0.3'
//    implementation 'com.google.firebase:firebase-perf:19.1.1'
//    // Add the Firebase Crashlytics SDK.
//    implementation 'com.google.firebase:firebase-crashlytics:17.4.1'

    // Recommended: Add the Google Analytics SDK.
//    implementation 'com.google.firebase:firebase-analytics:18.0.3'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.gms:play-services-places:17.0.0'
    implementation 'com.github.drawers:SpinnerDatePicker:2.1.0'
    implementation 'com.github.yuyakaido:CardStackView:v2.3.4'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.github.syedowaisali:crystal-range-seekbar:77d3cc9994'
    implementation 'com.naver.android.helloyako:imagecropview:1.2.0'
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    kapt 'androidx.room:room-compiler:2.8.4'
    implementation 'com.android.installreferrer:installreferrer:2.2'
    // Unit testing dependencies
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    implementation 'androidx.test.espresso:espresso-idling-resource:3.6.1'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    // Import the BoM for the Firebase platform
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-perf'
    implementation 'com.google.firebase:firebase-crashlytics'

    // Declare the dependency for the Cloud Firestore library
    // When using the BoM, you don't specify versions in Firebase library dependencies
    implementation 'com.google.firebase:firebase-firestore'
    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"
    implementation "androidx.fragment:fragment-ktx:1.8.9"
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
    implementation "com.github.bumptech.glide:annotations:4.16.0"
    implementation "com.github.bumptech.glide:okhttp3-integration:4.16.0"
    implementation "com.karumi:dexter:6.2.1"
    implementation 'com.github.vestrel00.contacts-android:core:0.3.0'
//    implementation ('com.adevinta.android:leku:9.1.3') {
//        exclude group: 'androidx.appcompat'
//    }

}
