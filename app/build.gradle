def configureDetekt = { JavaExec task ->
    task.group = 'verification'
    task.classpath = configurations.detektCli
    task.mainClass = 'io.gitlab.arturbosch.detekt.cli.Main'
    task.args(
            '--input', file('src/main/java').absolutePath,
            '--baseline', file('detekt-baseline-debug.xml').absolutePath,
            '--build-upon-default-config',
            '--jvm-target', '17',
            '--parallel',
            '--report', "html:${file('build/reports/detekt/detekt.html').absolutePath}",
            '--report', "xml:${file('build/reports/detekt/detekt.xml').absolutePath}",
            '--report', "sarif:${file('build/reports/detekt/detekt.sarif').absolutePath}",
            '--report', "txt:${file('build/reports/detekt/detekt.txt').absolutePath}"
    )
}

tasks.register('detekt', JavaExec) {
    configureDetekt(delegate)
}

tasks.register('detektBaseline', JavaExec) {
    configureDetekt(delegate)
    args '--create-baseline'
}
