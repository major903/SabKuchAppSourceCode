plugins {
    id 'com.android.application'
    id 'com.google.firebase.crashlytics'
    id 'com.google.gms.google-services'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
    id 'org.jlleitschuh.gradle.ktlint'
}

def registrationApiBaseUrl = (project.findProperty('registrationApiBaseUrl') ?: 'https://api.sabkuchworld.com').toString().replace('"', '\\"')
def registrationCompanyId = (project.findProperty('registrationCompanyId') ?: '').toString().replace('"', '\\"')
def appUpdateManifestUrl = (project.findProperty('appUpdateManifestUrl') ?: 'https://raw.githubusercontent.com/major903/SabKuchApp-Updates/main/update.json').toString().replace('"', '\\"')
// Bunny Stream playback needs only a public Video Library ID. Keep privileged API keys on the server.
def bunnyStreamLibraryId = (project.findProperty('bunnyStreamLibraryId') ?: '').toString().replace('"', '\\"')
def mapsApiKey = (project.findProperty('mapsApiKey') ?: System.getenv('SABKUCH_MAPS_API_KEY') ?: '').toString().replace('"', '\\"')
def enableTestCoverage = (project.findProperty('enableTestCoverage') ?: 'false').toString().toBoolean()
def stableDebugKeystorePath = (project.findProperty('sabkuchDebugKeystore')
        ?: System.getenv('SABKUCH_DEBUG_KEYSTORE')
        ?: 'E:/BatoBuzzBuildCache/AndroidUserHome/debug.keystore').toString()
def stableDebugKeystore = file(stableDebugKeystorePath)
// Play Store release bundle signing:
// - Keystore: <project>/key/mysuru.keystore
// - Alias: mysuru_alias
// - Set SABKUCH_RELEASE_KEYSTORE, SABKUCH_RELEASE_STORE_PASSWORD,
//   SABKUCH_RELEASE_KEY_ALIAS, and SABKUCH_RELEASE_KEY_PASSWORD in the shell.
// - Build with: .\gradlew.bat :app:bundleRelease
// Never commit signing passwords to this file.
def releaseKeystorePath = project.findProperty('sabkuchReleaseKeystore') ?: System.getenv('SABKUCH_RELEASE_KEYSTORE')
def releaseKeystorePassword = project.findProperty('sabkuchReleaseStorePassword') ?: System.getenv('SABKUCH_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = project.findProperty('sabkuchReleaseKeyAlias') ?: System.getenv('SABKUCH_RELEASE_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('sabkuchReleaseKeyPassword') ?: System.getenv('SABKUCH_RELEASE_KEY_PASSWORD')

android {
    namespace = 'vedam.subkuch'
    compileSdk = 37
    signingConfigs {
        debug {
            // IMPORTANT: Keep this keystore stable. A different generated debug key changes the
            // certificate and Android will reject in-place updates with UPDATE_INCOMPATIBLE.
            // Override with -PsabkuchDebugKeystore=... or SABKUCH_DEBUG_KEYSTORE on other machines.
            if (stableDebugKeystore.exists()) {
                storeFile stableDebugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    defaultConfig {
        applicationId "vedam.subkuch"
        minSdk = 26
        targetSdk = 36
        versionCode = 63
        versionName = "1.0.23"
        multiDexEnabled = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        // Can be overridden per build, for example:
        // gradlew -PregistrationApiBaseUrl=https://api.example.com -PregistrationCompanyId=123 assembleDebug
        buildConfigField "String", "REGISTRATION_API_BASE_URL", "\"${registrationApiBaseUrl}\""
        buildConfigField "String", "REGISTRATION_COMPANY_ID", "\"${registrationCompanyId}\""
        buildConfigField "String", "APP_UPDATE_MANIFEST_URL", "\"${appUpdateManifestUrl}\""
        buildConfigField "String", "BUNNY_STREAM_LIBRARY_ID", "\"${bunnyStreamLibraryId}\""
        buildConfigField "String", "MAPS_API_KEY", "\"${mapsApiKey}\""
        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            testCoverageEnabled = enableTestCoverage
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        // Lint crashes on this AGP/JDK combo (NoSuchMethodError List.removeLast in its
        // bundled Kotlin compiler). Skip lint on release builds; run it explicitly if needed.
        checkReleaseBuilds = false
    }
    buildFeatures {
        dataBinding = true
        viewBinding = true
        buildConfig = true
    }
    compileOptions {
        encoding = 'UTF-8'
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
            freeCompilerArgs.addAll([
                    "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi",
                    "-opt-in=kotlinx.coroutines.FlowPreview"
            ])
        }
    }

}

